name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  path-guard:
    name: Block internal paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if forbidden paths are tracked
        run: |
          set -euo pipefail
          FORBIDDEN=$(
            git ls-files \
              | grep -E '^(docs/|\.cursor/|AGENTS\.md|\.env$|\.env\.[^/]+$)' \
              | grep -vxF '.env.example' \
              || true
          )
          PEN_FILES=$(git ls-files '*.pen' || true)
          if [ -n "$FORBIDDEN" ] || [ -n "$PEN_FILES" ]; then
            echo "::error::Forbidden paths tracked in git:"
            echo "$FORBIDDEN"
            echo "$PEN_FILES"
            exit 1
          fi
          echo "Path guard passed — no internal files tracked."

  lint-typecheck-build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    needs: path-guard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          CI: true

  api:
    name: Bruno API tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start server for functional API tests
        run: RATE_LIMIT_DISABLED=true pnpm start &
        env:
          CI: true
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          exit 1
      - run: pnpm test:api
      - name: Restart server for rate-limit test
        run: |
          set -euo pipefail
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp || true
          fi
          pkill -f "next start" || true
          pkill -f "next-server" || true
          for i in $(seq 1 20); do
            if ! curl -sf http://localhost:3000 > /dev/null; then
              echo "Port 3000 is free"
              break
            fi
            echo "Waiting for previous server to stop..."
            sleep 1
            if [ "$i" -eq 20 ]; then
              echo "Previous server still responding on :3000"
              exit 1
            fi
          done
          pnpm start &
        env:
          CI: true
      - name: Wait for server (rate limit enabled)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          exit 1
      - run: pnpm test:api:rate-limit
